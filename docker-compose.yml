version: "3.8"

# Local test environment for the Obsidian Notes theme.
#
# Usage:
#   docker compose up -d
#   open http://localhost:8080, run the WordPress install wizard,
#   then Appearance > Themes > activate "Obsidian Notes".
#
# Import demo-content.xml via Tools > Import > WordPress
# (install the "WordPress Importer" plugin first if prompted).

services:
  wordpress:
    image: wordpress:6.6-php8.2-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./obsidian-notes:/var/www/html/wp-content/themes/obsidian-notes
      - wordpress_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wordpress_data:
  db_data:
